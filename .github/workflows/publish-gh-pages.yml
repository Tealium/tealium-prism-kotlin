name: Publish Github Pages

on:
  push:
    branches:
      - main
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Specify runner +  build & upload the static files as an artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Android"
        uses: ./.github/actions/android-setup
        with:
          cache: 'off' # publishing builds cold: no restored Gradle state, nothing saved

      - name: "Build documentation"
        id: build
        run: ./gradlew :docs:dokkaGenerate

      - name: "Upload static files as artifact"
        id: upload-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/dokka/html

      - name: "Build documentation for docs.tealium.com"
        run: ./gradlew :docs:dokkaGenerate -PDOKKA_TEMPLATES_DIR=docs-tealium-com

      - name: "Push to gh-pages branch"
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # Set this to the directory produced by :docs:dokkaGenerate
          publish_dir: ./docs/build/dokka/html-docs-tealium-com
          # Recreate gh-pages as an orphan branch → exactly one commit each deploy
          force_orphan: true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1