name: "Publish Snapshot"

on:
  workflow_dispatch:
    inputs:
      AWS_ACCESS_KEY:
        description: "ACCESS_KEY"
        required: true
      AWS_SECRET_KEY:
        description: "SECRET_KEY"
        required: true
      AWS_SESSION_TOKEN:
        description: "SESSION_TOKEN"
        required: true

jobs:
  publish:
    name: Publish Snapshot
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY: ${{ inputs.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ inputs.AWS_SECRET_KEY }}
      AWS_SESSION_TOKEN: ${{ inputs.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-setup
        with:
          cache: 'off' # publishing builds cold: no restored Gradle state, nothing saved

      - name: Publish
        run: ./gradlew publishReleasePublicationToSnapshotRepository -PSNAPSHOT=true