name: "Setup Android Env"
description: "Install Java and Gradle; restore the Gradle cache unless cache is off"

inputs:
  java-version:
    default: '17'
  cache:
    description: "read-only (default): restore the Gradle caches but don't save them; write: restore and save (only the dev cache writer, ci-cache-warm.yml); off: no restore, no save (e.g. release builds)"
    default: 'read-only'

runs:
  using: "composite"
  steps:
    - name: Check the cache input
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
      run: |
        case "$CACHE" in
          read-only|write|off) ;;
          *) echo "::error::android-setup: cache must be read-only, write or off, got '$CACHE'"; exit 1 ;;
        esac

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        cache-read-only: ${{ inputs.cache != 'write' }}
        cache-disabled: ${{ inputs.cache == 'off' }}
