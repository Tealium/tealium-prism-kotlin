name: "Compress and upload reports"
description: "Compresses all reports, and uploads the artifacts"

inputs:
  artifact-name:
    required: true

runs:
  using: "composite"
  steps:
    - name: Compress Reports
      continue-on-error: true
      if: ${{ always() }}
      shell: bash
      run: ./gradlew compressReports

    - name: Upload Reports
      continue-on-error: true
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: reports/*.zip